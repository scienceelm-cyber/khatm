name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khatm-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          platform="$ANDROID_HOME/platforms/android-37.0"
          if [[ ! -f "$platform/android.jar" && -f "$platform/android-37.0/android.jar" ]]; then
            cp -a "$platform/android-37.0/." "$platform/"
          fi
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Test, lint and build APKs
        working-directory: android
        run: ./gradlew testDebugUnitTest lintRelease assembleDebug assembleRelease --no-daemon
      - name: Prepare verified build outputs
        run: |
          mkdir -p android/ci-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android/ci-artifacts/khatm-v2.1.0-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/ci-artifacts/khatm-v2.1.0-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android/ci-artifacts/apksigner.jar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: khatm-android-v2.1.0-build
          path: android/ci-artifacts/*
          if-no-files-found: error
          retention-days: 14
