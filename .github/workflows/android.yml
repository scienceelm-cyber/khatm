name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khatm-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
          platform="$ANDROID_HOME/platforms/android-37.0"
          if [[ ! -f "$platform/android.jar" && -f "$platform/android-37.0/android.jar" ]]; then
            cp -a "$platform/android-37.0/." "$platform/"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build APKs
        working-directory: android
        run: ./gradlew testDebugUnitTest lintRelease assembleDebug assembleRelease --no-daemon
      - name: Prepare verified build outputs
        run: |
          mkdir -p android/.ci-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk android/.ci-artifacts/khatm-v2-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android/.ci-artifacts/khatm-v2-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android/.ci-artifacts/apksigner.jar
      - uses: actions/upload-artifact@v7
        with:
          name: khatm-android-v2-build
          path: android/.ci-artifacts/*
          if-no-files-found: error
          retention-days: 14
